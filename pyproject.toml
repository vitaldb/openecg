[project]
name = "openecg"
version = "0.9.1"
description = "Clinically-grounded discrete tokenization and per-frame wave segmentation for electrocardiograms"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Hyung-Chul Lee", email = "vital@snu.ac.kr" },
]
keywords = [
    "ecg",
    "electrocardiogram",
    "tokenization",
    "segmentation",
    "delineation",
    "p-wave",
    "qrs",
    "t-wave",
    "deep-learning",
    "biomedical",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Core (`openecg.detect_qrs`, `openecg.detect_pacings`) is **numpy-only**.
# All heavier dependencies live in optional extras — install only what you
# need. The DSP primitives (Butterworth IIR, filtfilt, find_peaks,
# wavelets) live in the standalone `opendsp` package — same numpy-only
# implementation, just extracted so openeeg/openvital can use it directly
# without going through openecg. ``openecg.dsp`` re-exports for backwards
# compatibility.
dependencies = [
    "numpy>=1.26",
    "opendsp>=0.1.0",
]

[project.optional-dependencies]
# PhysioNet dataset loaders (butpdb, ludb, mitdb, ptbxl, qtdb, isp).
# wfdb reads the WFDB binary format; scipy.signal.{decimate,resample}
# is used by butpdb's resampling helpers.
loaders = ["wfdb>=4.1", "scipy>=1.11"]

# Stage-2 neural backbones, datasets, and SSL heads (transformer over
# discrete ECG tokens, plus HuBERT/ST-MEM/ECG-FM/ECG-Founder loaders).
stage2 = [
    "scipy>=1.11",
    "torch>=2.6",
    "transformers>=4.40",
    "huggingface-hub>=0.20",
]

# Full P/Q/R/S/T wave delineation via NeuroKit2 (DWT-based). Required
# only by `openecg.delineate.run`.
delineate = ["neurokit2>=0.2.7", "scipy>=1.11"]

# Inference runtimes for deploy — TFLite for the boundary detector
# (`openecg.deploy.Inference`, ~5 MB wheel) and onnxruntime for the int8
# layered codec (`openecg.deploy.OnnxCodec` / `openecg.report`, ~3.6 MB
# model). PyTorch is NOT required at inference time for either.
deploy = ["tflite-runtime>=2.14", "onnxruntime>=1.17", "numpy>=1.26"]

# Agent-facing structured report (`openecg.report`) on the torch-free int8
# ONNX codec — the minimal lightweight path: onnxruntime + numpy only.
report = ["onnxruntime>=1.17", "numpy>=1.26"]

# Dev-only: PyTorch → TFLite conversion for `openecg.deploy.export_boundary_tflite`.
deploy-export = [
    "torch>=2.6",
    "ai-edge-torch>=0.2",
]

# Everything (loaders + stage2 + delineate + deploy-runtime).
all = [
    "wfdb>=4.1",
    "scipy>=1.11",
    "torch>=2.6",
    "transformers>=4.40",
    "huggingface-hub>=0.20",
    "neurokit2>=0.2.7",
    "tflite-runtime>=2.14",
    "onnxruntime>=1.17",
]

[project.urls]
Homepage = "https://github.com/vitaldb/openecg"
Repository = "https://github.com/vitaldb/openecg"
Issues = "https://github.com/vitaldb/openecg/issues"

[dependency-groups]
dev = [
    "pytest>=7.4",
    "build>=1.2",
    "twine>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Include the model binaries even though they are git-ignored (they're
# force-added to the repo). Needed so both sdist and wheel carry them.
[tool.hatch.build]
artifacts = [
    "openecg/models/*.tflite",
    "openecg/models/*.pt",
    "openecg/models/*.onnx",
    "openecg/models/*MODEL_CARD.md",
]

[tool.hatch.build.targets.wheel]
packages = ["openecg"]

# Bundle the deployable models inside the wheel so ``openecg.deploy.Inference()``
# and ``openecg.load_codec()`` work with no extra downloads.
[tool.hatch.build.targets.wheel.force-include]
"openecg/models/boundary_int8.tflite" = "openecg/models/boundary_int8.tflite"
"openecg/models/codec_v1.pt" = "openecg/models/codec_v1.pt"
"openecg/models/codec_v1_int8.onnx" = "openecg/models/codec_v1_int8.onnx"
"openecg/models/codec_v1_MODEL_CARD.md" = "openecg/models/codec_v1_MODEL_CARD.md"
"openecg/models/codec_v3.pt" = "openecg/models/codec_v3.pt"
"openecg/models/codec_v3_int8.onnx" = "openecg/models/codec_v3_int8.onnx"
"openecg/models/codec_v3_MODEL_CARD.md" = "openecg/models/codec_v3_MODEL_CARD.md"
"openecg/models/codec_v4.pt" = "openecg/models/codec_v4.pt"
"openecg/models/codec_v4_int8.onnx" = "openecg/models/codec_v4_int8.onnx"
"openecg/models/codec_v4_MODEL_CARD.md" = "openecg/models/codec_v4_MODEL_CARD.md"
"openecg/models/codec_v5.pt" = "openecg/models/codec_v5.pt"
"openecg/models/codec_v5_int8.onnx" = "openecg/models/codec_v5_int8.onnx"
"openecg/models/codec_v5_MODEL_CARD.md" = "openecg/models/codec_v5_MODEL_CARD.md"

[tool.hatch.build.targets.sdist]
include = [
    "openecg/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
